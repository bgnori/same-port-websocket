name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean-and-protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Protocol and Autobahn-style conformance tests (stdlib Python)
        run: python3 -m unittest discover -s tests -p 'test_ws_*.py'

  autobahn:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-limits
            config: fuzzingclient.json
            max: ""
            report: ws-echo
          - name: full-size
            config: fuzzingclient-full.json
            max: "16777216"
            report: ws-echo-full
    name: autobahn (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - name: Run Autobahn|Testsuite (Docker, image digest pinned)
        run: |
          .lake/build/bin/wsecho 8090 ${{ matrix.max }} &
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:8090/health >/dev/null 2>&1 && break
            sleep 0.1
          done
          mkdir -p reports
          docker run --rm --network=host \
            -v "$PWD/tools/autobahn:/config:ro" \
            -v "$PWD/reports:/reports" \
            crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074 \
            wstest -m fuzzingclient -s /config/${{ matrix.config }}
      - name: Evaluate report
        run: sudo python3 tools/autobahn/check_report.py reports/${{ matrix.report }}/index.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-${{ matrix.report }}
          path: reports/
